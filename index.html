<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Man HUD - Tuned Gestures</title>
    <script>
        window.savedRequire = window.require;
        window.process = undefined;
        window.module = undefined;
        window.exports = undefined;
        window.require = undefined;
    </script>
    <style>
        body { 
            margin: 0; 
            background: #020813; 
            color: #00f0ff; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            overflow: hidden; 
        }
        video { display: none; }
        canvas { 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            display: block; 
            filter: drop-shadow(0 0 10px #00f0ff);
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 15, 35, 0.85);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            color: #00f0ff;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
            pointer-events: none;
            text-transform: uppercase;
        }
        .hud-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00f0ff;
            border-style: solid;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 10px #00f0ff;
        }
        .top-left { top: 20px; left: 20px; border-width: 3px 0 0 3px; }
        .top-right { top: 20px; right: 20px; border-width: 3px 3px 0 0; }
        .bottom-left { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; }
        .bottom-right { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; }
    </style>
    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="hud-panel" id="status-text">INITIALIZING HUD...</div>
    
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const ipcRenderer = window.savedRequire ? window.savedRequire('electron').ipcRenderer : null;

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let braveCooldown = false;
        let latestHandsResults = null;
        let latestFaceResults = null;

        let celebrationParticles = [];
        let celebrationTimer = 0;
        let zoomLevel = 1.0;

        function isPieceSign(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;
            return indexUp && middleUp && ringDown && pinkyDown;
        }

        function triggerCelebration() {
            celebrationTimer = 90;
            for (let i = 0; i < 60; i++) {
                celebrationParticles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: ['#00ff66', '#00ffff', '#ff0055', '#ffd700'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 6 + 3
                });
            }
        }

        function renderFrame() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (latestHandsResults && latestHandsResults.image) {
                canvasCtx.drawImage(latestHandsResults.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let facesCount = 0;

            // Render Faces (Mesh grid, eyes, oval - NO lips)
            if (latestFaceResults && latestFaceResults.multiFaceLandmarks) {
                facesCount = latestFaceResults.multiFaceLandmarks.length;
                for (const landmarks of latestFaceResults.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: 'rgba(0, 240, 255, 0.35)', lineWidth: 1.0});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00ffff', lineWidth: 2.2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00ffff', lineWidth: 2.2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: 'rgba(0, 240, 255, 0.75)', lineWidth: 2.0});
                }
            }

            let pieceDetected = false;
            let handsCount = 0;
            let handsLandmarksList = [];
            let pinchingActive = false;

            // Render Hands & Check Gestures
            if (latestHandsResults && latestHandsResults.multiHandLandmarks) {
                handsCount = latestHandsResults.multiHandLandmarks.length;
                for (let i = 0; i < handsCount; i++) {
                    const landmarks = latestHandsResults.multiHandLandmarks[i];
                    handsLandmarksList.push(landmarks);
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ff66', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#00f0ff', lineWidth: 1, radius: 4});

                    if (isPieceSign(landmarks)) {
                        pieceDetected = true;
                    }

                    // Strict Pinch detection for Zooming (Thumb tip [4] and Index tip [8])
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

                    if (pinchDist < 0.04) {
                        pinchingActive = true;
                        // Zoom in when pinching fingers close
                        zoomLevel = Math.min(2.0, zoomLevel + 0.02);
                    } else if (pinchDist > 0.15) {
                        // Zoom out when spreading fingers wide
                        zoomLevel = Math.max(1.0, zoomLevel - 0.02);
                    }
                }
            }

            // Apply smooth zoom scaling to the canvas view
            canvasElement.style.transform = `scaleX(-1) scale(${zoomLevel})`;

            // Fixed Clap Detection: Requires strict closeness between palm bases (landmark 0) AND index MCPs (landmark 5) to prevent false triggers
            let clapDetected = false;
            if (handsCount >= 2) {
                const h1_wrist = handsLandmarksList[0][0];
                const h2_wrist = handsLandmarksList[1][0];
                const h1_index = handsLandmarksList[0][5];
                const h2_index = handsLandmarksList[1][5];

                const wristDist = Math.hypot(h1_wrist.x - h2_wrist.x, h1_wrist.y - h2_wrist.y);
                const indexDist = Math.hypot(h1_index.x - h2_index.x, h1_index.y - h2_index.y);

                if (wristDist < 0.08 && indexDist < 0.10) {
                    clapDetected = true;
                }
            }

            if (clapDetected && celebrationTimer <= 0) {
                triggerCelebration();
            }

            // Celebration rendering
            if (celebrationTimer > 0) {
                celebrationTimer--;
                for (let p of celebrationParticles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    canvasCtx.fill();
                }
                statusText.style.borderColor = "#00ff66";
                statusText.style.boxShadow = "0 0 25px #00ff66";
                statusText.innerText = `🎉 CELEBRATION UNLOCKED! 🎉`;
            } else {
                statusText.style.borderColor = "#00f0ff";
                statusText.style.boxShadow = "0 0 20px rgba(0, 240, 255, 0.6)";

                if (pieceDetected) {
                    statusText.innerText = `[!] PIECE SIGN LOCKED -> OPENING BRAVE | Faces: ${facesCount} | Hands: ${handsCount}`;
                    if (!braveCooldown) {
                        if (ipcRenderer) {
                            ipcRenderer.send('open-external-app', 'brave');
                        }
                        braveCooldown = true;
                        setTimeout(() => { braveCooldown = false; }, 5000);
                    }
                } else if (pinchingActive) {
                    statusText.innerText = `[ZOOM LEVEL: ${zoomLevel.toFixed(1)}x]`;
                } else {
                    statusText.innerText = `HUD ONLINE | Faces: ${facesCount} | Hands: ${handsCount} (PINCH TO ZOOM)`;
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 4, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults((results) => {
            latestHandsResults = results;
            renderFrame();
        });

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({ maxNumFaces: 4, refineLandmarks: false, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        faceMesh.onResults((results) => {
            latestFaceResults = results;
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start().then(() => {
            statusText.innerText = "MULTI-USER HUD ONLINE";
        });
    </script>
</body>
</html>
