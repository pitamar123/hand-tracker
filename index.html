<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Visibility Face & Hand Tracker</title>
    <script>
        window.savedRequire = window.require;
        window.process = undefined;
        window.module = undefined;
        window.exports = undefined;
        window.require = undefined;
    </script>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        video { display: none; }
        canvas { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); display: block; }
        .status { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 16px; padding: 10px 20px; background: rgba(0,0,0,0.85); border: 2px solid #00FF00; border-radius: 8px; font-weight: bold; }
    </style>
    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="status" id="status-text">Loading Face Mesh & Hands...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const ipcRenderer = window.savedRequire ? window.savedRequire('electron').ipcRenderer : null;

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let braveCooldown = false;
        let latestHandsResults = null;
        let latestFaceResults = null;

        function isPieceSign(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;
            return indexUp && middleUp && ringDown && pinkyDown;
        }

        function checkSmile(landmarks) {
            const mouthLeft = landmarks[61];
            const mouthRight = landmarks[291];
            const mouthWidth = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
            
            const faceLeft = landmarks[234];
            const faceRight = landmarks[454];
            const faceWidth = Math.hypot(faceLeft.x - faceRight.x, faceLeft.y - faceRight.y);

            return (mouthWidth / faceWidth) > 0.38;
        }

        function renderFrame() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (latestHandsResults && latestHandsResults.image) {
                canvasCtx.drawImage(latestHandsResults.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let faceStatus = "Face: Neutral 😐";

            // Process & Draw High-Visibility Face Mesh
            if (latestFaceResults && latestFaceResults.multiFaceLandmarks) {
                for (const landmarks of latestFaceResults.multiFaceLandmarks) {
                    // Bright neon cyan face grid structure
                    drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: 'rgba(0, 240, 255, 0.35)', lineWidth: 1});
                    
                    // Highlight facial contours (eyes, lips, brows) in bright orange/yellow
                    drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FFD700', lineWidth: 2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#FFD700', lineWidth: 2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#FF3366', lineWidth: 2});

                    if (checkSmile(landmarks)) {
                        faceStatus = "Face: Smiling 😊";
                    }
                }
            }

            let pieceDetected = false;

            // Process & Draw Hand Skeletons
            if (latestHandsResults && latestHandsResults.multiHandLandmarks) {
                for (let i = 0; i < latestHandsResults.multiHandLandmarks.length; i++) {
                    const landmarks = latestHandsResults.multiHandLandmarks[i];
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0055', lineWidth: 1, radius: 4});

                    if (isPieceSign(landmarks)) {
                        pieceDetected = true;
                    }
                }
            }

            if (pieceDetected) {
                statusText.innerText = `Piece Sign Detected! Opening Brave... | ${faceStatus}`;
                if (!braveCooldown) {
                    if (ipcRenderer) {
                        ipcRenderer.send('open-external-app', 'brave');
                    }
                    braveCooldown = true;
                    setTimeout(() => { braveCooldown = false; }, 5000);
                }
            } else {
                statusText.innerText = `Show Piece Sign | ${faceStatus}`;
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            latestHandsResults = results;
            renderFrame();
        });

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults((results) => {
            latestFaceResults = results;
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start().then(() => {
            statusText.innerText = "Tracking Active (High-Vis Face & Hands)";
        });
    </script>
</body>
</html>
