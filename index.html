<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Iron Man HUD</title>
    <script>
        window.savedRequire = window.require;
        window.process = undefined;
        window.module = undefined;
        window.exports = undefined;
        window.require = undefined;
    </script>
    <style>
        body { 
            margin: 0; 
            background: #020813; 
            color: #00f0ff; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            overflow: hidden; 
        }
        video { display: none; }
        canvas { 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            display: block; 
            filter: drop-shadow(0 0 10px #00f0ff);
        }
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 15, 35, 0.85);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            color: #00f0ff;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
            pointer-events: none;
            text-transform: uppercase;
        }
        .hud-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00f0ff;
            border-style: solid;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 10px #00f0ff;
        }
        .top-left { top: 20px; left: 20px; border-width: 3px 0 0 3px; }
        .top-right { top: 20px; right: 20px; border-width: 3px 3px 0 0; }
        .bottom-left { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; }
        .bottom-right { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; }
    </style>
    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="hud-panel" id="status-text">INITIALIZING MULTI-USER HUD...</div>
    
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const ipcRenderer = window.savedRequire ? window.savedRequire('electron').ipcRenderer : null;

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        let braveCooldown = false;
        let latestHandsResults = null;
        let latestFaceResults = null;

        function isPieceSign(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;
            return indexUp && middleUp && ringDown && pinkyDown;
        }

        function checkSmile(landmarks) {
            const mouthLeft = landmarks[61];
            const mouthRight = landmarks[291];
            const mouthWidth = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
            
            const faceLeft = landmarks[234];
            const faceRight = landmarks[454];
            const faceWidth = Math.hypot(faceLeft.x - faceRight.x, faceLeft.y - faceRight.y);

            return (mouthWidth / faceWidth) > 0.38;
        }

        function renderFrame() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (latestHandsResults && latestHandsResults.image) {
                canvasCtx.drawImage(latestHandsResults.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let facesCount = 0;
            let smilingCount = 0;

            // Render Multiple Faces cleanly (Cyan outlines, gold eyes, pink lips)
            if (latestFaceResults && latestFaceResults.multiFaceLandmarks) {
                facesCount = latestFaceResults.multiFaceLandmarks.length;
                for (const landmarks of latestFaceResults.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00ffff', lineWidth: 2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00ffff', lineWidth: 2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#ff0055', lineWidth: 2});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: 'rgba(0, 240, 255, 0.45)', lineWidth: 1.5});

                    if (checkSmile(landmarks)) {
                        smilingCount++;
                    }
                }
            }

            let pieceDetected = false;
            let handsCount = 0;

            // Render Multiple Hands Skeletons
            if (latestHandsResults && latestHandsResults.multiHandLandmarks) {
                handsCount = latestHandsResults.multiHandLandmarks.length;
                for (let i = 0; i < handsCount; i++) {
                    const landmarks = latestHandsResults.multiHandLandmarks[i];
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ff66', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#00f0ff', lineWidth: 1, radius: 4});

                    if (isPieceSign(landmarks)) {
                        pieceDetected = true;
                    }
                }
            }

            if (pieceDetected) {
                statusText.innerText = `[!] PIECE SIGN LOCKED -> OPENING BRAVE | Faces: ${facesCount} | Hands: ${handsCount}`;
                if (!braveCooldown) {
                    if (ipcRenderer) {
                        ipcRenderer.send('open-external-app', 'brave');
                    }
                    braveCooldown = true;
                    setTimeout(() => { braveCooldown = false; }, 5000);
                }
            } else {
                statusText.innerText = `HUD ONLINE | Faces: ${facesCount} (Smiling: ${smilingCount}) | Hands: ${handsCount}`;
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        // Configured to track up to 4 hands at once
        hands.setOptions({ maxNumHands: 4, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            latestHandsResults = results;
            renderFrame();
        });

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        // Configured to track up to 4 faces at once
        faceMesh.setOptions({ maxNumFaces: 4, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults((results) => {
            latestFaceResults = results;
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start().then(() => {
            statusText.innerText = "MULTI-USER HUD ONLINE";
        });
    </script>
</body>
</html>
