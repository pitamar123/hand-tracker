<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Iron Man HUD with Pinch Drag</title>
    <script>
        window.savedRequire = window.require;
        window.process = undefined;
        window.module = undefined;
        window.exports = undefined;
        window.require = undefined;
    </script>
    <style>
        body { 
            margin: 0; 
            background: #020813; 
            color: #00f0ff; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            overflow: hidden; 
        }
        video { display: none; }
        canvas { 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            display: block; 
            filter: drop-shadow(0 0 10px #00f0ff);
        }
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 15, 35, 0.85);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            color: #00f0ff;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
            cursor: grab;
            user-select: none;
            text-transform: uppercase;
        }
        .hud-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00f0ff;
            border-style: solid;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 10px #00f0ff;
        }
        .top-left { top: 20px; left: 20px; border-width: 3px 0 0 3px; }
        .top-right { top: 20px; right: 20px; border-width: 3px 3px 0 0; }
        .bottom-left { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; }
        .bottom-right { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; }
    </style>
    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="hud-panel" id="status-text">INITIALIZING HUD...</div>
    
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

        const ipcRenderer = window.savedRequire ? window.savedRequire('electron').ipcRenderer : null;

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');

        // Pinch dragging state
        let isDragging = false;

        function isPieceSign(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;
            return indexUp && middleUp && ringDown && pinkyDown;
        }

        function triggerCelebration() {
            celebrationTimer = 90;
            for (let i = 0; i < 60; i++) {
                celebrationParticles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: ['#00ff66', '#00ffff', '#ff0055', '#ffd700'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 6 + 3
                });
            }
        }
